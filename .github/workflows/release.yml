name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: langgraph-rs-linux-amd64
            architecture: x64
            extension: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: langgraph-rs-macos-amd64
            architecture: x64
            extension: ''
          - os: macos-15
            target: aarch64-apple-darwin
            asset_name: langgraph-rs-macos-arm64
            architecture: arm64
            extension: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: langgraph-rs-windows-amd64.exe
            architecture: x64
            extension: '.exe'

    defaults:
      run:
        shell: bash
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must match package version v{version}')
          PY

      - name: Build and smoke-test CLI
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          cargo build --locked --release --package langgraph-cli --bin langgraph-rs --target "$TARGET"
          "target/$TARGET/release/langgraph-rs$EXTENSION" --help
          "target/$TARGET/release/langgraph-rs$EXTENSION" --version

      - name: Verify macOS binary has no build-machine library dependencies
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          otool -L "target/$TARGET/release/langgraph-rs" > dependencies.txt
          cat dependencies.txt
          python - <<'PY'
          from pathlib import Path
          for line in Path('dependencies.txt').read_text().splitlines()[1:]:
              library = line.strip().split(' (', 1)[0]
              if not library.startswith(('/usr/lib/', '/System/Library/')):
                  raise SystemExit(f'Non-system library dependency in release binary: {library}')
          PY

      - name: Prepare release asset
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/langgraph-rs$EXTENSION" "dist/$ASSET_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
