name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to validate before publication'
        type: string
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --all-extras

      - name: Install local inspector package into the selected Python environment
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv pip install --no-deps ./langgraph-inspector
          uv run --locked --all-extras python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='').write(f'LANGGRAPH_PYTHON={sys.executable}\n')"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings

      - name: Check standalone CLI without Python bindings
        run: cargo clippy --locked --package langgraph-cli --all-targets -- -D warnings

      - name: Build
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Run tests
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test --locked --workspace --all-targets --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --all-extras

      - name: Install local inspector package into the selected Python environment
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          uv pip install --no-deps ./langgraph-inspector
          uv run --locked --all-extras python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8', newline='').write(f'LANGGRAPH_PYTHON={sys.executable}\n')"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run Python fixtures
        run: |
          for fixture in tests/fixtures/*.py; do
            echo "Running $fixture..."
            uv run --locked --all-extras python "$fixture"
          done

      - name: Type check with mypy
        run: uv run --locked --all-extras mypy tests/fixtures/

      - name: Lint with ruff
        run: uv run --locked --all-extras ruff check tests/fixtures/

      - name: Format check with black
        run: uv run --locked --all-extras black --check tests/fixtures/

  ci:
    name: CI
    if: always()
    needs: [test, coverage, python-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all build and test jobs to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$PYTHON_RESULT" = success
